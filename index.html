<!-- Onaro launch splash: "Walking into the light" (2026-09-23). Instant
     first paint: original artwork (img/splash-art.jpg) + a looping walking-motion
     video layered on top (muted/autoplay/playsinline; static poster is the
     fallback). A CSS ring-wave shimmer (.splash-ringwave: screen-blend streaks
     flowing along the tilted ring band) keeps the golden rings alive and
     rippling; the beam shimmers in the video. Three living elements: walking
     students, rippling rings, shimmering beam.
     Wordmark/tagline/copyright are crisp HTML, never baked into art.
     HUB.splashDone() (js/app.js) exits after boot + first tab render; the inline
     backstop below frees it even if boot JS fails, and <noscript> hides it. -->

=".85" stroke-linecap="round"/><path class="logo-frontarc" d="M191.9 131.6 A112 34 -24 0 1 87.9 177.9" fill="none" stroke="#D4F53F" stroke-width="18" opacity=".25"/><path class="logo-frontarc" d="M191.9 131.6 A112 34 -24 0 1 87.9 177.9" fill="none" stroke="url(#frSD)" stroke-width="7.5"/><path class="logo-frontarc logo-ringflow" d="M191.9 131.6 A112 34 -24 0 1 87.9 177.9" fill="none" stroke="#F2FF8A" stroke-width="7.5" stroke-linecap="round" pathLength="100" stroke-dasharray="22 78"/><g class="logo-rider" opacity="0"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#orbSD"/></animateMotion><set attributeName="opacity" to="0" begin="0s" dur="3s" repeatCount="indefinite"/><set attributeName="opacity" to="1" begin="3s" dur="3s" repeatCount="indefinite"/><circle r="11" fill="#ffffff" opacity=".22"/><circle r="5" fill="#FFF6D8"/></g><g class="logo-rider" opacity="0"><animateMotion dur="16s" repeatCount="indefinite"><mpath href="#orbSD"/></animateMotion><set attributeName="opacity" to="0" begin="0s" dur="8s" repeatCount="indefinite"/><set attributeName="opacity" to="1" begin="8s" dur="8s" repeatCount="indefinite"/><circle r="9" fill="#FF7A5C"/></g></svg></span><span class="sw-l">n</span><span class="sw-l">a</span><span class="sw-l">r</span><span class="sw-l">o</span></div>

<script>
window.__splashT0=Date.now();
/* Onaro backend API (Render). When set, degree plans, professors and
   horoscopes load on-demand from the database instead of bundled JSON. */
window.__ONARO_API_BASE='https://onaro-api-kqmo.onrender.com';
try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('#splash svg').forEach(function(s){try{s.pauseAnimations()}catch(e){}})}}catch(__e){}try{var __sv=document.querySelector('#splash video');if(__sv){__sv.muted=true;__sv.addEventListener('playing',function(){var __sa=document.getElementById('splashArt');if(__sa)__sa.classList.add('vidon');});var __skt=0;var __kick=function(){var __sa=document.getElementById('splashArt');if(!document.getElementById('splash')||!__sa)return;if(!__sv.paused&&__sv.readyState>1)return;if(__skt>=5){__sa.classList.add('novideo');return;}__skt++;var __sp=__sv.play();if(__sp&&__sp.catch)__sp.catch(function(){});setTimeout(__kick,600);};__sv.addEventListener('canplay',__kick);__kick();}}catch(__e){}
setTimeout(function(){
  var s=document.getElementById('splash'); if(!s||s.getAttribute('data-gone'))return;
  s.setAttribute('data-gone','1'); s.classList.add('splash-out');
  setTimeout(function(){ if(s.parentNode)s.parentNode.removeChild(s); window.__splashGone=Date.now(); },650);
},5300);
</script>
