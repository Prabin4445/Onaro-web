<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- ORBIT mark — Deep Ink + Volt Signal identity. Shape refined from concept 1. -->
  <!-- orbit ring, full ellipse behind planet (planet hides the back arc) -->
  <ellipse cx="118.0" cy="132.0" rx="110.0" ry="30.0" transform="rotate(-26 118.0 132.0)"
           fill="none" stroke="#C6F135" stroke-width="10.0"/>
  <!-- planet -->
  <circle cx="118.0" cy="132.0" r="68.0" fill="#101408"/>
  <!-- front half of ring crossing in front of the planet -->
  <ellipse cx="118.0" cy="132.0" rx="110.0" ry="30.0" transform="rotate(-26 118.0 132.0)"
           fill="none" stroke="#C6F135" stroke-width="10.0" stroke-linecap="round"
           pathLength="100" stroke-dasharray="50 50" stroke-dashoffset="0"/>
  <!-- satellite dot riding the ring -->
  <circle cx="203.0" cy="77.0" r="10.0" fill="#FF5C38"/>
</svg>
